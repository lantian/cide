name: CI

# Every gate in this repository was, until this file existed, a gate only because a human
# remembered to run it. `cargo xtask codegen --check` and `cargo xtask contract-check` are
# described throughout the source as "CI gates"; this is the CI that makes that true.
on:
  # Push is master only. It was unrestricted while this repository was private and every
  # branch was one person's — the argument then was that work happens on long-lived branches
  # (m7-hooks-and-fixes, m8-m11-integration, agent worktrees) that may go days before a PR
  # exists, so a gate firing only at merge time reports the breakage after the branch that
  # broke it has moved on. Publishing changed the arithmetic rather than the argument: five
  # jobs on every push to every branch, on shared runners, is a lot of minutes spent
  # re-answering a question nobody asked yet.
  #
  # `pull_request` is what keeps the gate real — nothing reaches master unreviewed without
  # passing it — and `workflow_dispatch` is how a feature branch gets a full run on demand
  # before there is a PR. The old duplicate-run cost is gone with this: a same-repo PR branch
  # now produces one run, not two.
  #
  # Not covered any more, and worth knowing: `release/v<version>`, which release.yml cuts
  # and pushes. Its content is master plus a version bump, and the release jobs build the
  # package without running the test suite. Add 'release/**' below to get that gate back.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the first run's answer worthless, and the rust jobs are
# minutes long. The trunk is exempt: its runs are the record of what shipped.
#
# `master`, not `main` — this repository's trunk is master (release.yml cuts
# release/v<version> from it), and the exemption named a branch that does not exist here, so
# the one branch it was written to protect was the one being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A backtrace turns "assertion failed" into a location. Free on a green run.
  RUST_BACKTRACE: 1
  # A cheaper build profile for every cargo step in CI, set here rather than in Cargo.toml so
  # neither `./run.sh` nor a local `./test.sh` changes. `[profile.dev]` is opt-level 1 with
  # full debuginfo (and every dependency at opt-level 2) because the dev build is the IDE
  # people actually use; tests need none of it. Measured on this workspace (2026-11-19, every
  # workspace crate rebuilt — which is what each CI run does, since rust-cache keeps only
  # dependencies): opt-level 0 for the workspace cut its summed per-crate compile time from
  # 761 s to 276 s, and line-tables-only debuginfo to 229 s. The suite pinned to 4 cores (the
  # runner's size) ran in 61 s instead of 57 s — four seconds of test time for minutes of
  # compile. `[profile.dev.package."*"]` still wins for dependencies, so they stay at
  # opt-level 2: libgit2 and the tree-sitter grammars run inside the tests too. Backtraces
  # keep file and line under line-tables-only; only a debugger's variables are lost.
  #
  # Both variables also enter rust-cache's key (it hashes every `CARGO*` variable), so
  # changing either starts a fresh cache rather than restoring artifacts this profile can't
  # use. The jobs that run no cargo build ignore them.
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------------------------
  # The structural invariant, on its own so it answers in seconds.
  #
  # The rule is "only cide-app may depend on tauri", so the check is every workspace
  # member except cide-app — not just cide-headless. Checking cide-headless alone reaches
  # cide-core, cide-ipc and cide-pty and nothing else: cide-git, cide-fs, cide-search,
  # cide-claude, cide-hook, cide-ide-mcp and xtask are outside its graph entirely, and a
  # tauri dependency added to any of them would have passed that check green.
  # ---------------------------------------------------------------------------------
  no-tauri-outside-app:
    name: only cide-app links tauri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # `cargo tree` resolves the lockfile without compiling anything, so this job needs
      # neither the webview system libraries nor a warm target/ — hence cache: "false".
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"

      - name: Run shared no-tauri checks
        run: ./test.sh --only no-tauri

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-no-tauri
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # Every shell script still runs on macOS's bash.
  #
  # macOS ships bash 3.2.57 as /bin/bash — the last GPLv2 release — and every script here has
  # `#!/usr/bin/env bash`, so that is what runs them on a Mac with no newer bash on PATH.
  # `run.sh` died that way once, at `mapfile: command not found` with an unbound-variable
  # cascade behind it, before it had started anything (docs/platforms.md has the account).
  #
  # It is here rather than in the macos job for two reasons. That job is advisory
  # (continue-on-error), so it gates nothing; and the check is a grep, so it needs no Mac —
  # what it is checking is the source, not the host. Seconds, no toolchain, no checkout cache.
  #
  # ubuntu-24.04 runs this under bash 5, which is the point: the class is invisible to the
  # shell running the check, which is why a shell that would catch it is no defence at all.
  # ---------------------------------------------------------------------------------
  shell-portability:
    name: every *.sh runs on bash 3.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run shared shell checks
        run: ./test.sh --only shell

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-shell
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # Rust, as two jobs that run side by side: lint (fmt, contract, check, clippy, codegen) and
  # test. They were one job of six sequential steps until 2026-11-19; nothing in one uses the
  # other's artifacts — `check` and `clippy` emit metadata, `cargo test` builds code, and
  # `codegen --check` builds cide-ipc's tests under its own `-p` feature set — so running them
  # one after the other only added their times together. `./test.sh --only rust` still runs
  # both, which is what a local run should do; check-test-runner.py pins that the two groups
  # add up to it, so a step dropped from both cannot pass as a green split.
  # ---------------------------------------------------------------------------------
  rust-lint:
    name: rust-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps

      # Its own cache entry: check/clippy metadata and a test build cannot share target/
      # contents, and one key for both would have each job evict the other's.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-lint

      - name: Run shared rust lint checks
        run: ./test.sh --only rust-lint

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-rust-lint
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  rust-test:
    name: rust-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/linux-deps

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-test

      # --no-fail-fast so a failed test binary does not conceal the failures in other
      # packages. Ignored tests stay ignored.
      - name: Run shared rust tests
        run: ./test.sh --only rust-test

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-rust-test
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # Frontend: typecheck, the project's own check:* harness, and the production build.
  # ---------------------------------------------------------------------------------
  ui:
    name: ui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # ui/package.json has no `packageManager` field, so pnpm/action-setup has nothing to
      # infer from and the version has to be stated here. 9.15.4 is the release that wrote
      # ui/pnpm-lock.yaml (lockfileVersion 9.0), and `--frozen-lockfile` below is only
      # meaningful against the version that produced the lockfile. Adding
      # "packageManager": "pnpm@9.15.4" to ui/package.json would delete this pin and this
      # comment with it.
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.4

      # setup-node's built-in pnpm store cache; it must run *after* pnpm exists on PATH.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Installs with --frozen-lockfile, enumerates every check:* in package.json, and builds.
      - name: Run shared ui checks
        run: ./test.sh --only ui

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-ui
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # macOS: does the workspace still compile, pass its tests and lint clean on a Mac?
  #
  # ## Advisory, on purpose, and the one thing to read before changing that
  #
  # `continue-on-error: true`. **cide has never been compiled, run or bundled on macOS** —
  # not once, by anybody — and it cannot be from the machine it is developed on: linking
  # `cide-app` for `*-apple-darwin` needs Apple's linker and the macOS SDK, which are
  # licensed to Apple hardware, and Tauri documents cross-compiling Windows from Linux and
  # nothing else. So the first run of this job is the first time the compiler has ever seen
  # this code for that target, and a red X on it is *information*, not a broken branch.
  #
  # Making it blocking is the right move the moment it has been green once. Do that by
  # deleting the `continue-on-error` line and saying so in docs/platforms.md,
  # which is where the honest state of macOS support is recorded. Leaving it advisory after
  # it goes green is how a gate becomes decoration.
  #
  # ## What it deliberately does not do
  #
  # No `contract-check`, no `codegen --check`, no packaging. The first two are host
  # independent — they parse Rust source and diff JSON — so running them twice buys nothing
  # and costs a second place for them to disagree. Packaging is a twenty-minute job that
  # needs `cargo-tauri`, and `cargo xtask package --dmg` refuses on a non-Mac host anyway;
  # when someone wants a `.dmg`, that is a release workflow and not this one.
  #
  # The `ui` and `no-tauri-outside-app` jobs are not duplicated either: `check:*` scripts are
  # node compiling TypeScript, and `cargo tree` resolves a lockfile. Neither has a platform.
  #
  # ## The rule that this job exists to protect
  #
  # **The `#[tauri::command]` surface must stay identical across platforms.** `contract-check`
  # parses `generate_handler!` in `crates/cide-app/src/lib.rs` textually, so a
  # `#[cfg(target_os = "linux")]` on a *registration* would drift `contract/commands.json`
  # green on one host and red on the other, and the frontend's `client.ts` would call a
  # command that does not exist there. Platform differences belong inside handler bodies —
  # `cmd::session::cwd_of_pid` is the shape to copy — never in the registration list.
  #
  # ## Cost
  #
  # `macos-15` runners are arm64 and free for public repositories; on a private one they bill
  # at ten times the Linux per-minute rate, which is the number most likely to decide whether
  # this job stays. No system dependencies to install — WebKit *is* the OS there, so the whole
  # `libwebkit2gtk-4.1-dev` block above has no analogue. Expect 10–15 minutes cold, dominated
  # by git2's vendored libgit2/openssl and the tree-sitter grammars.
  # ---------------------------------------------------------------------------------
  macos:
    name: macos (advisory)
    runs-on: macos-15
    continue-on-error: true
    # Pushes to master only, since 2026-11-19: on every PR push it took 31–39 min — longer
    # than any other job — for an answer nobody waited on, because it is advisory. A
    # `workflow_dispatch` run skips it too; to get it on demand for a branch, widen this to
    # `github.event_name != 'pull_request'`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: macos

      # Native macOS formatting, check, all tests and clippy. The platform-independent
      # contract and codegen gates are covered by the rust-lint job.
      - name: Run shared macos checks
        run: ./test.sh --only macos

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-macos
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------
  # The fork pins, checked for reachability and nothing else.
  #
  # `cargo xtask package` compares each lock against a *local* checkout, which proves the
  # machine doing the packaging agrees with the pin and proves nothing about the machine
  # doing the release: release.yml fetches these three revisions anonymously from GitHub,
  # and every way that fetch can fail is invisible until a release run is ten minutes in.
  # A pin can stop resolving without anyone touching this repository — a tag force-moved or
  # deleted in a fork, a rewritten `cide` branch orphaning the commit it named, a fork made
  # private, a repository renamed. All of those are somebody else's action on somebody
  # else's repository, so nothing here changes and the file keeps looking correct.
  #
  # `git ls-remote <url> <rev>` is the whole check: seconds, no clone, anonymous exactly as
  # the release fetch is anonymous — so a fork that has gone private fails here too, which
  # is the point. It does not build anything and does not verify content; `--locked` and
  # preflight cover that. A pin is not verified as *reachable* by anything else.
  # ---------------------------------------------------------------------------------
  fork-pins:
    name: the fork pins still resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run shared fork-pins checks
        run: ./test.sh --only fork-pins

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-fork-pins
          path: target/ci-checks/
          if-no-files-found: ignore
          retention-days: 7
