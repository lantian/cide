<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cide</title>
    <!--
      Blocking, in <head>, and deliberately before anything else: it writes `data-theme`
      from the `?theme=` parameter so the first frame is already the right colour. Moving it
      to the bottom of <body>, making it `defer`/`type=module`, or folding it into
      `main.tsx` all reintroduce the flash. See `public/theme-boot.js`.
    -->
    <script src="/theme-boot.js"></script>
    <!--
      Ctrl+Shift+R reloads, dev server only. Classic and outside the module graph so it still
      listens when `main.tsx` failed to evaluate and the window is white. See the file.
    -->
    <script src="/dev-reload.js"></script>
  </head>
  <body>
    <!--
      One document for every window. The role — shell, detached pane, detached tab — comes
      from the `?window=<label>` query parameter that `windows.rs` bakes into the URL.
      There is exactly one webview per OS window; the pane grid is DOM.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
