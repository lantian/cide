[workspace]
resolver = "3"
members = [
    "crates/cide-ipc",
    "crates/cide-core",
    "crates/cide-pty",
    "crates/cide-claude",
    "crates/cide-ide-mcp",
    "crates/cide-remote",
    "crates/cide-git",
    "crates/cide-gitlab",
    "crates/cide-fs",
    "crates/cide-search",
    "crates/cide-tasks",
    "crates/cide-spec",
    "crates/cide-agents",
    "crates/cide-lang",
    "crates/cide-lsp",
    "crates/cide-deps",
    "crates/cide-docker",
    "crates/cide-ext",
    "crates/cide-hook",
    "crates/cide-headless",
    "crates/cide-app",
    "xtask",
]

[workspace.package]
version = "0.10.2-dev"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/lantian/cide"

# Single source of truth for every third-party version. Individual crates say
# `foo = { workspace = true }` and never pin a version themselves.
#
# NOTE: `wry` and `tao` are deliberately absent. Tauri 2.11.5 pins wry ^0.55 / tao ^0.35
# while crates.io latest is 0.56 / 0.36; because these are 0.x, a direct dependency here
# would silently fork the graph into two incompatible webview stacks. See docs/adr/0001.
[workspace.dependencies]
# --- internal ---
cide-ipc = { path = "crates/cide-ipc" }
cide-core = { path = "crates/cide-core" }
cide-pty = { path = "crates/cide-pty" }
cide-claude = { path = "crates/cide-claude" }
cide-ide-mcp = { path = "crates/cide-ide-mcp" }
cide-remote = { path = "crates/cide-remote" }
cide-git = { path = "crates/cide-git" }
cide-gitlab = { path = "crates/cide-gitlab" }
# GitLab REST transport, isolated in cide-gitlab; redirects never carry tokens.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
cide-fs = { path = "crates/cide-fs" }
cide-search = { path = "crates/cide-search" }
cide-tasks = { path = "crates/cide-tasks" }
cide-spec = { path = "crates/cide-spec" }
cide-agents = { path = "crates/cide-agents" }
cide-lang = { path = "crates/cide-lang" }
cide-lsp = { path = "crates/cide-lsp" }
cide-deps = { path = "crates/cide-deps" }
cide-docker = { path = "crates/cide-docker" }
cide-ext = { path = "crates/cide-ext" }

# --- shell (only cide-app may depend on tauri) ---
# `devtools` so a release build can still open an inspector. Debug builds enable it anyway;
# without this, the one configuration a user could send a trace from is the one that cannot.
tauri = { version = "2.11.5", features = ["protocol-asset", "devtools"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-store = "2.4.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-log = "2.9.0"
# Only for parenting the folder picker to the app window; see `cmd::project::project_pick`.
#
# The same version and features tauri 2.11.5 already pins on Linux, deliberately: `gtk` is
# 0.x, so a different minor here would fork the graph into two incompatible GTK stacks and
# `WebviewWindow::gtk_window()` would hand back a window of the *other* crate's type. Named
# here rather than reached through `tauri::` because tauri does not re-export it. It costs
# no new compilation — wry already builds it — and it is the reason `docs/adr/0001`'s
# argument about `wry`/`tao` does not apply: this pin matches rather than competes.
gtk = { version = "0.18", features = ["v3_24"] }
# The macOS dock menu, and nothing else. (`crates/cide-app/src/dock.rs`)
#
# The same argument the `gtk` pin above makes, one platform over: these are versions tauri's
# own graph already resolves — tao and muda pull `objc2 0.6` and `objc2-app-kit 0.3` on macOS —
# so naming them here matches rather than competes, and adds no compilation to a build that
# already links AppKit. There is no Tauri, tao or muda API for `applicationDockMenu:`; that is
# the whole reason a direct dependency exists at all, and `dock.rs`'s header says why the hook
# cannot be reached any other way.
#
# `default-features = false` with the four headers spelled out: the default set is every header
# in AppKit, and this needs a menu, a menu item, the application and the responder it inherits
# from. The union with whatever tao and muda enable is what actually gets built, so this list is
# a statement about *our* requirements rather than a saving.
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }

# --- terminal ---
portable-pty = "0.9.0"
vt100 = "0.16.2"
crossbeam-channel = "0.5.16"

# --- git / fs / search ---
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
ignore = "0.4.33"
globset = "0.4.20"
# Reading a `.vsix` — a VS Code extension package, which is a plain ZIP — so that a colour theme
# can be imported from the file people actually download rather than from a `.json` they had to
# unzip first. (M24)
#
# `default-features = false, features = ["deflate-flate2"]` and that is the whole reason this is
# affordable: the default set drags in aes, bzip2, lzma, ppmd, zstd, xz and a time crate, none of
# which a `.vsix` uses — every entry in one is stored or deflated. `deflate-flate2` routes
# inflation through `flate2`, which is **already in the graph** as a transitive dependency of the
# image decoders, so naming it here costs one small crate rather than a compression zoo.
#
# A hand-written ZIP reader was the alternative and lost on the merits: a central-directory parser
# is a hundred lines against an untrusted archive, and the failure modes it has to get right
# (malformed offsets, a truncated entry, a decompression bomb) are exactly what a well-exercised
# library has already got right. `cide_core::scheme` still caps entry size and theme count on top
# of it, because a library being correct about the format says nothing about the size of what it
# hands back.
zip = { version = "4.6.0", default-features = false, features = ["deflate-flate2"] }
# The inflate backend `zip`'s `deflate-flate2` asks for but does not choose.
#
# `deflate-flate2` enables `dep:flate2` and stops there; the crate then fails to compile with
# *"You need to choose a zlib backend"*, because feature unification is per build graph and
# nothing else in `cide-core`'s graph turns one on. `zip` offers two composites and both were
# rejected: `deflate-flate2-zlib` wants the system libz, and `deflate-flate2-zlib-rs` pulls the
# `zlib-rs` crate. Naming `flate2` here with its default `rust_backend` instead selects
# `miniz_oxide`, which the image decoders already build — so the whole `.vsix` road costs `zip`,
# `arbitrary` and nothing else.
flate2 = "1.1.9"
# Encoding the clipboard's bitmap as a PNG, for *Paste* over the file tree and the editor. (M35)
#
# The whole encoder and nothing else: the clipboard hands over raw RGBA and a file has to hold
# a format. `image` was the alternative and it is the wrong size of tool here — it is a decoder
# and codec suite for two dozen formats, all of which this workspace already refuses to depend
# on (`cide_core::image` sniffs bytes and never decodes; the pixels are the webview's job, see
# `crates/cide-ipc/src/image.rs`). `png` is one format, it is what a screenshot is, and 0.18 is
# a version already in `Cargo.lock` through the graph — so this costs the build nothing new.
#
# `default-features = false` drops `rayon`: a paste is one image on a thread that is already
# blocking, and a thread pool for it would be started once and used once.
png = { version = "0.18.1", default-features = false }
# Naming a pasted image after the moment it was pasted, in the user's own timezone. Already in
# the graph via `tauri-plugin-log`; `default-features = false` with `clock` and `std` is the
# local-time conversion and nothing else — no serde, no `oldtime`, no parser.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nucleo = "0.5.0"
# Content search. `nucleo` is a fuzzy matcher over paths and is the wrong tool for a grep:
# it scores a subsequence, and "every line that loosely resembles the query" is noise when
# the user asked for `fn spawn`. `regex` also carries the *literal* mode, via
# `regex::escape` — one engine means the case-sensitivity and whole-word toggles behave
# identically in both modes, and its literal prefilters make an escaped pattern about as
# fast as a hand-written `memmem`. Already in the graph as a transitive dependency of
# `ignore`, so naming it here costs no new compilation.
regex = "1.13.1"
tree-sitter = "0.26.11"
# The grammars, for `cide-lang`.
#
# They do **not** depend on `tree-sitter`, which is why a grammar crate two minor versions
# behind the core still links: each depends only on `tree-sitter-language ^0.1` — the decoupling
# shim that core 0.26.11 also depends on — and names `tree-sitter` as a *dev*-dependency for its
# own tests. So nothing here forks the graph the way ADR 0001 describes for `wry`/`tao`;
# verified against crates.io rather than assumed.
#
# Both are the newest published versions (`tree-sitter-rust` 2026-03-27, `tree-sitter-go`
# 2025-08-29) and both generate ABI 15, inside core 0.26's accepted 13..=15. tree-sitter is
# backwards-compatible with grammars built by an older CLI and not forwards-compatible, and this
# is the backwards direction. `cide_lang::tables` has a test that fails loudly if a grammar bump
# ever renames a node kind out from under the extractor — which has already happened once,
# `method_spec` → `method_elem` in tree-sitter-go 0.25.
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"

# --- language servers ---
# The LSP wire types, for `cide-lsp`.
#
# This is the same 0.x hazard ADR 0001 describes for `wry`/`tao`, reaching the opposite
# conclusion, and the reason is containment rather than a different risk appetite: `lsp-types` is
# a dependency of **exactly one crate**, and `cide-lsp` must never re-export it. Everything that
# crosses that crate's boundary is cide's own `cide_ipc::Diagnostic`, so a future bump is a diff
# inside one file rather than a fork of the graph. If a second crate ever wants it, that is the
# moment to reconsider — not now.
#
# Taken rather than hand-rolled because the risk is in what we *receive*, not what we send. The
# eight messages cide sends are an afternoon's work; `publishDiagnostics` alone carries
# `relatedInformation`, `tags`, `codeDescription`, `data` and `version`, and a hand-written struct
# that omits a field drops it in silence. It is data — serde structs and `#[repr]` enums — with no
# runtime, no transport and no traits to implement, so being wrong about it is a compile error.
#
# 0.97.0 is max, newest and max-stable, published 2024-06-04 with nothing since: frozen at LSP
# 3.17, which is exactly what rust-analyzer and gopls speak. For a pinned dependency that freeze
# is an asset. `async-lsp` was the alternative and it pins `lsp-types ^0.95`, which would resolve
# two incompatible 0.x versions into the graph — the exact failure this workspace's rule exists to
# prevent. `tower-lsp` is a framework for building *servers*.
lsp-types = "0.97.0"
# --- containers ---
# The Docker Engine API client (ADR 0013). A dependency of **exactly one crate** — `cide-docker`
# — which must never re-export it, the rule `lsp-types` states two entries up and for the same
# reason: everything crossing that crate's boundary is cide's own `cide_ipc::docker` DTO, so a
# bump is a diff inside one crate rather than a fork of the graph.
#
# Hand-rolling the client was considered and lost on the ground the `zip` entry already argues:
# chunked transfer-encoding, the 8-byte stdcopy demux frame, connection hijacking for exec, and
# `DOCKER_HOST` parsing are each a small correctness trap against a stream cide does not control,
# and there are four of them before anything useful happens.
#
# `default-features = false` with the default set spelled out again, which is **not** a saving
# and is written that way on purpose: `pipe` is the unix-socket road (`connect_with_socket` is
# `cfg(all(feature = "pipe", unix))`) and it looks like it drags a Windows transport in, but
# bollard declares `hyper-named-pipe` under `[target."cfg(windows)".dependencies]`, so on Linux
# and macOS it costs nothing. Naming the set explicitly is what makes the *absent* features the
# statement: no `ssl`, no `ssh`, no `websocket`, no `chrono`, no `buildkit`. TLS above all — an
# `https://` endpoint refuses by name in `Docker::open` rather than connecting in the clear, and
# that refusal is only honest while this line has no TLS feature to fall back on.
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
# Reading one file out of a container. (M44)
#
# `GET /containers/{id}/archive?path=` answers with a **tar stream** and there is no endpoint that
# answers with a file — so a tar reader is not a convenience here, it is the only road. Hand-rolling
# one was considered and lost on the `zip` entry's argument: a 512-byte-header format with three
# incompatible extensions for long names (GNU, POSIX/pax, v7) is a hundred lines against an archive
# cide did not create, and the failure mode of getting it wrong is reading the wrong bytes rather
# than an error.
#
# `default-features = false`: the default set adds `xattr` and `filetime`, which exist to *extract*
# an archive onto a filesystem faithfully. cide never extracts — it reads one entry into memory —
# so both are cost with no use.
tar = { version = "0.4.44", default-features = false }


# --- async / mcp ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-tungstenite = "0.30.0"
# `WebSocketStream`'s `Stream`/`Sink` impls come from here, so driving a socket at all needs
# the traits named. Already in the graph as tokio-tungstenite's own dependency.
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
# The sealed transport: every frame between cide and a paired device is an AEAD box. (M72)
#
# XChaCha20-Poly1305 rather than TLS, and the argument is in ADR 0015: React Native's `WebSocket`
# exposes no certificate hook on either platform, so pinning a self-signed cert needs native work
# on both — and pinning *per paired instance*, which is what this feature actually requires, needs
# it twice. Sealing the frames instead is pure Rust here and pure JS there.
#
# 0.10 rather than 0.11 on purpose: it is the line whose `aead`, `cipher` and `universal-hash`
# this workspace's lockfile already resolves, so the marginal build is four small pure-Rust
# crates and no C.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
# The key agreement. `curve25519-dalek` underneath it is the same implementation everything else
# in the ecosystem uses, and `static_secrets` is what lets the instance keep a long-lived key.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
# Deriving four keys and two nonce prefixes from one shared secret. `sha2` is already here.
hkdf = "0.12.4"
# So a key that goes out of scope does not stay in the heap for whatever reads it next.
zeroize = "1.8"
subtle = "2.6.1"

# --- data ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# Where in a document a deserialise failed, so `cide_core::persist` can drop the one element a
# newer or intermediate build wrote rather than the whole `workspace.json`.
serde_path_to_error = "0.1.20"
ts-rs = { version = "12.0.1", features = [
    "serde-compat",
    "no-serde-warnings",
    "indexmap-impl",   # project and window order is meaningful — see cide-ipc::Workspace
    "serde-json-impl", # keybinding `args` are opaque JSON
    "uuid-impl",
] }
indexmap = { version = "2.14.0", features = ["serde"] }
dashmap = "6"
parking_lot = "0.12.5"
smallvec = "1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
blake3 = "1.8.6"

# The pairing QR, encoded in `cide_core::remote::qr`. `default-features = false` is the whole
# point of the entry: the defaults are `image`, `pic` and `svg`, and `image` is the decoder
# suite this workspace refuses on principle (see `png` above, and `image::encode_png`). What is
# left is a pure encoder over bytes, which is unit-testable and draws nothing — the webview
# turns the module grid into SVG rects itself.
#
# It is also deliberately optional in the design rather than load-bearing: if this ever cannot
# be trimmed to an encoder, drop it and show the code and `host:port` as large text, which is
# eight characters typed once per device. Nothing else depends on the matrix existing.
qrcode = { version = "0.14.1", default-features = false }
# For the checksum `cargo xtask package --run` prints beside each release artefact. sha256
# rather than the blake3 above it, because the number is for a release page: it is what
# `sha256sum -c` and GitHub's own attestations speak, and a checksum a downloader cannot verify
# with the tool they already have is not a checksum. Already in the graph transitively at this
# exact version, so naming it costs no new compilation — the same argument as `regex` and
# `getrandom` above.
sha2 = "0.10.9"
rayon = "1.12.0"

# --- process lifecycle ---
# A GTK main loop makes a signal handler a hostile place to do work: almost nothing is
# legal inside one, and taking the workspace lock from a handler deadlocks whenever the
# interrupted thread already held it. signal-hook's handler writes to a self-pipe and
# nothing else, which is what lets the shutdown path run on an ordinary thread.
signal-hook = "0.4.4"
# For `kill(2)`. `PtySession` can only SIGKILL, and the shutdown ladder needs SIGHUP and
# SIGTERM first so a `claude` gets to finish writing its transcript.
libc = "0.2.189"
# Randomness for the IDE lockfile's auth token. Already in the graph transitively via uuid,
# so naming it directly costs nothing and makes the credential's source explicit.
getrandom = "0.4.3"

# --- diagnostics ---
# Named directly only so `tauri-plugin-log`'s `level_for` can be given a `LevelFilter`. It is
# already in the graph via the plugin; this workspace logs through `tracing`, which now
# bridges into it (see below).
log = "0.4.33"
thiserror = "2.0.19"
anyhow = "1.0.104"
# The `log` feature is what makes the 60-odd `tracing::` call sites in this workspace do
# anything at all. There is no `tracing-subscriber` installed anywhere — checked, not assumed:
# no crate calls `set_global_default`, and until this line `tracing`'s dependency list held
# only `pin-project-lite`, `tracing-attributes` and `tracing-core`, i.e. no `log` bridge. Every
# `tracing::warn!` in the app compiled, ran, and went nowhere. With `log` enabled they emit
# `log` records, which `tauri-plugin-log` — already installed in `lib.rs` — writes to the log
# file, the terminal and the webview console.
#
# The alternative that lost was installing `tracing-subscriber` and its own file appender. It
# is the more capable option, and it would have meant two independent logging stacks writing
# two files, with `tauri-plugin-log` still owning the one that `app_open_log_dir` points a user
# at. One destination is worth more here than span support nothing currently emits.
tracing = { version = "0.1.44", features = ["log"] }

[profile.dev]
# The webview + libgit2 + tree-sitter make a fully-unoptimised dev build painful to use.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
