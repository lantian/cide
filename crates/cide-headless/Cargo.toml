[package]
name = "cide-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The standing proof that the core is frontend-free: it renders a live session from the
# vt100 mirror to stdout with zero Tauri linked. If this ever stops compiling, domain
# logic has leaked into the app crate.
[[bin]]
name = "cide-headless"
path = "src/main.rs"

[dependencies]
cide-core = { workspace = true }
cide-ipc = { workspace = true }
cide-pty = { workspace = true }
# M18's two domain crates, here for the reason the comment above gives rather than for the
# printing. Both arrived without ever being linked by the proof, so the guard covered less than
# it claimed to for a milestone; `tasks` and `agents` call their real loaders — `cide_tasks::read`
# and `cide_agents::load_project` — so an `AppHandle` reached for in either crate stops this
# binary building the same way one in `cide-core` does.
cide-tasks = { workspace = true }
# And `cide-spec`, for the same reason: M28 added it, and a crate this binary does not link is a
# crate the no-tauri proof does not cover. It is also the only way to see whether this machine's
# `openspec` is findable from a launch whose PATH is not a shell's.
cide-spec = { workspace = true }
cide-agents = { workspace = true }
# M22's crate, linked for the same reason and after the same mistake: `tasks` and `agents` are in
# this list because M18 added two crates the proof never linked, and for a milestone the guard
# covered less than it claimed to. `ext` calls the real `ExtStore::new`, so an `AppHandle` reached
# for anywhere in `cide-ext` stops this binary building.
cide-ext = { workspace = true }
# M41's crate, linked for the reason the list keeps restating: a crate this binary does not link
# is a crate the no-tauri proof does not cover. It is also the fastest way to see which daemon a
# launch resolves to — `cide_docker::connect`'s ladder reads a context store, so the answer
# differs between machines and is the first thing to ask for when a panel says there is no Docker
# on a machine where `docker ps` works.
cide-docker = { workspace = true }
