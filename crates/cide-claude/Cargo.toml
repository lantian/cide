[package]
name = "cide-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cide-ipc = { workspace = true }
# For `child_env` only: the one-shot lane spawns `claude` with `std::process::Command`, and a
# cide launched from its AppImage must not lend that child the bundle's `PYTHONHOME` — it
# kills every stdio MCP server the run would have loaded. The rule lives in `cide-core`
# because four spawn sites in three crates need the same answer.
cide-core = { workspace = true }
# Two things, both of which would otherwise be copied rather than shared: the ESRCH-only pid
# liveness rule (`lockfile::pid_is_alive`) that the hook-socket sweep needs, and
# `protocol::SUPPORTED_CLI`, the verified CLI range `version::check_once` warns outside of.
# A second copy of either is a second thing to get wrong on the next CLI release.
cide-ide-mcp = { workspace = true }
cide-pty = { workspace = true }
# The digest that guards a permission answer against a prompt that moved. A real hash rather than
# the screen's own line digests, because this one is a safety check and not a repaint
# optimisation — see `permission`.
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The real-CLI test mints a session id to demand back from the hook payload.
uuid = { workspace = true }
# The permission corpus is written as the *text a prompt draws*, run through a real parser, so a
# fixture reads as the screen it is rather than as a page of serialised rows. See `permission`.
vt100 = { workspace = true }

# A *dev*-dependency, and it was a normal one until `orphans::arm` moved to
# `cide_core::child_env`. Nothing this crate compiles calls libc any more — the one remaining
# use is the test that pins `DEATH_SIGNAL == libc::SIGTERM`, which is worth keeping because the
# alternative is asserting against a bare `15` and losing the name that makes it checkable.
# Still `cfg(unix)`-gated so the crate builds for a target with no `prctl` at all.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
