[package]
name = "cide-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The domain. Owns everything durable: the workspace tree, settings, keymap, the command
# registry and persistence. Deliberately has no `tauri` dependency so `cide-headless` can
# link it without a webview — that is the standing proof the core is frontend-free.
[dependencies]
cide-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }

# Unix-only, and gated so the crate still compiles for a target with no `prctl` at all.
# `child_env` needs it for PR_SET_PDEATHSIG; everything else here is portable.
#
# This block moved from `cide-claude` along with `child_env::arm`. The rule it implements is
# not about `claude` — it is about every child this application forks — and leaving it in the
# Claude supervisor meant a new spawning crate had to depend on that supervisor to be armed.
# See docs/adr/0008.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
