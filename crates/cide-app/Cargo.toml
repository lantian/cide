[package]
name = "cide-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# THE ONLY crate that may depend on `tauri`.
#
# Everything here is glue by policy: command handlers that unwrap arguments, call into a
# domain crate and wrap the result. If a handler grows logic, that logic belongs in
# cide-core. `cide-headless` linking the same domain crates without tauri is the standing
# check that this rule is being kept.
[[bin]]
name = "cide"
path = "src/main.rs"

[dependencies]
cide-core = { workspace = true }
cide-ipc = { workspace = true }
cide-claude = { workspace = true }
cide-ide-mcp = { workspace = true }
cide-pty = { workspace = true }
cide-fs = { workspace = true }
cide-search = { workspace = true }
cide-git = { workspace = true }
# M12: the tree-sitter symbol layer, and the language-server client.
cide-lang = { workspace = true }
cide-lsp = { workspace = true }
# M13: what a project depends on, for the External Libraries group. Spawns `cargo` and `go`
# and parses their answers; see `crate::libraries` for the thread it must run on.
cide-deps = { workspace = true }
# M18: `.cide/tasks.json`. The store is the single owning actor for a project's tracker; this
# crate supplies the thread it deliberately does not own and the `AppHandle` it must not know
# about. See `crate::tasks_state`.
cide-tasks = { workspace = true }
# M18: the `cide_task_*` MCP vocabulary — names, schemas and handlers over a `TaskSink`. This
# crate supplies the socket (`crate::agent_rpc`) and the sink; the vocabulary itself has exactly
# one definition and is not in the `cide-hook` bridge, which is a dumb pipe.
cide-agents = { workspace = true }

tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-window-state = { workspace = true }

dashmap = { workspace = true }
# Only for `tauri_plugin_log::Builder::level_for`. This crate's own logging is `tracing`.
log = { workspace = true }
# The IDE server is async; `ide.rs` owns a runtime for it rather than making the app async.
tokio = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Unix-only, and gated so the crate still compiles for a target that has no signals at all.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

# The folder picker's parent window. Linux-only because that is the only platform where the
# dialog plugin declines to parent it for us — see `cmd::project::project_pick`.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }
