[package]
name = "cide-agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cide-ipc = { workspace = true }
# `child_env` for `terminal_child_env`, `arm` and `signal_group`; `claude_cli` for the launch
# filter and the `--append-system-prompt` fold. Every spawn site in the workspace passes through
# that module and this one is not an exception.
cide-core = { workspace = true }
# `SpawnSpec`. A subagent run is an ordinary PTY session that no pane happens to be showing, so
# it is built with the type the pane spawn site builds — there is no second process-hosting path
# to keep in step, which is what makes the shutdown ladder cover runs for free.
cide-pty = { workspace = true }
# `conversation` for the `--session-id`/`--resume` argv shapes, `inline_settings` for the hook
# payload, and `next_state` for the state machine a claude run reuses unchanged.
cide-claude = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
# `limits::probe`: one GET against a custom provider's own server, to read the model's window
# (M88). Blocking, because the caller is already on the blocking pool and this crate has no
# runtime; the same client shape `cide-gitlab` builds.
reqwest = { workspace = true }
tracing = { workspace = true }
# `render::stamp`: the wall-clock time a run's rendered row is prefixed with, in the machine's
# own zone. `cide-core` already links it with `clock`, so this is an edge, not a new crate.
chrono = { workspace = true }

# `SIGSTOP`/`SIGCONT` for `child_env::signal_group`. The mechanism lives in `cide-core`; only the
# two signal numbers are needed here, and off unix there is neither. Declared the way
# `cide-core` declares it, for the same reason — see docs/adr/0008.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
